<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sigma Vendor</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
:root{--p:#0878f9;--p2:#59c9fa;--bg:#f5f7fb;--card:#fff;--text:#10223a;--muted:#7f8b9b;--line:#dfe7f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Cairo,Arial;color:var(--text)}body.dark{--bg:#081525;--card:#102239;--text:#eef5ff;--muted:#9eacc0;--line:#263951}.screen{width:390px;height:844px;margin:auto;overflow:hidden;background:var(--bg);position:relative}.status{height:35px;padding:8px 19px;display:flex;direction:ltr;justify-content:space-between;font-size:12px;font-weight:700}.page{height:809px;padding:25px 22px;position:relative}.orb{position:absolute;border-radius:50%;background:linear-gradient(145deg,var(--p2),var(--p));opacity:.12}.a{width:230px;height:230px;right:-110px;top:-140px}.b{width:270px;height:270px;left:-150px;bottom:-160px}.content{position:relative;z-index:1}.brand{text-align:center}.brand img{width:250px;height:82px;object-fit:contain}.dark .brand img{filter:brightness(0) invert(1)}h1{font-size:23px;margin:13px 0 3px}.sub{font-size:12px;color:var(--muted);line-height:1.8}.form{margin-top:25px}.field{height:56px;border:1px solid var(--line);background:var(--card);border-radius:17px;margin:12px 0;padding:0 16px;display:flex;align-items:center;gap:11px;color:var(--muted);font-size:13px}.icon{color:var(--p);font-size:18px}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.small{font-size:11px;color:var(--muted)}.link{color:var(--p);font-weight:700}.btn{height:53px;width:100%;border:0;border-radius:17px;margin-top:20px;background:linear-gradient(100deg,var(--p),#25a7f5);color:#fff;font:700 14px Cairo;box-shadow:0 12px 24px #0878f933}.note{display:flex;gap:11px;padding:14px;border-radius:18px;background:#0878f912;font-size:12px;line-height:1.75}.badge{width:41px;height:41px;flex:none;border-radius:13px;background:#0878f51c;color:var(--p);display:grid;place-items:center;font-size:18px}.banner{margin:14px 0;padding:13px;border-radius:16px;color:#fff;font-size:12px;font-weight:700}.red{background:#c62828}.green{background:#11875d}.chathead{display:flex;gap:11px;align-items:center;margin-bottom:15px}.agent{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,var(--p2),var(--p));display:grid;place-items:center;color:#fff}.bubble{max-width:79%;padding:12px 14px;border:1px solid var(--line);background:var(--card);border-radius:18px;margin:12px 0;font-size:12px;line-height:1.6}.mine{margin-right:auto;background:#0878f51a}.input{position:absolute;bottom:20px;left:22px;right:22px;padding:10px 13px;border:1px solid var(--line);background:var(--card);border-radius:20px;display:flex;gap:10px}.send{width:36px;height:36px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center}.splash{position:absolute;inset:0;background:#075bc5 url('splash-bg.png') center/cover;display:grid;place-items:center}.splash img{width:76%;filter:brightness(0) invert(1) drop-shadow(0 12px 25px #00337466)}
.content{height:100%}</style></head><body><main class="screen"><div class="status"><span>9:41</span><span>● ● ● &nbsp;79%</span></div><div id="root"></div></main><script>
const q=new URLSearchParams(location.search),page=q.get('page')||'login';if(q.get('theme')==='dark')document.body.classList.add('dark');
const brand=(title,sub)=>`<div class="brand"><img src="logo.png"><h1>${title}</h1><p class="sub">${sub}</p></div>`;const shell=x=>`<section class="page"><i class="orb a"></i><i class="orb b"></i><div class="content">${x}</div></section>`;const form=(r=false)=>`<div class="form"><div class="field"><span class="icon">✉</span>البريد الإلكتروني</div>${r?'<div class="field"><span class="icon">☎</span>رقم الهاتف</div>':''}<div class="field"><span class="icon">▣</span>كلمة المرور</div>${r?'<div class="field"><span class="icon">✓</span>تأكيد كلمة المرور</div>':'<div class="row between small"><span>☑ تذكرني</span><span class="link">نسيت كلمة المرور؟</span></div>'}<button class="btn">${r?'إنشاء حساب التاجر':'تسجيل الدخول'}</button><p class="small" style="text-align:center;margin-top:16px">${r?'لديك حساب بالفعل؟ <span class="link">تسجيل الدخول</span>':'ليس لديك حساب؟ <span class="link">إنشاء حساب تاجر</span>'}</p></div>`;
const screens={splash:`<div class="splash"><img src="logo.png"></div>`,login:shell(brand('تسجيل دخول التاجر','بوابتك لإدارة المنتجات والطلبات والأرصدة في سيجما')+form()),register:shell(brand('إنشاء حساب تاجر','ابدأ شراكتك مع سيجما وأدر نشاطك بسهولة')+form(true)),forgot:shell(brand('استعادة كلمة المرور','استعد الوصول إلى حساب التاجر من خلال تذكرة آمنة')+`<div class="form"><div class="note"><b class="badge">✓</b><span>أرسل بيانات حسابك، ثم تابع رد الإدارة والمحادثة معها مباشرة.</span></div><button class="btn">بدء تذكرة الاستعادة</button></div>`),activation:shell(`<div class="chathead"><div class="agent">✓</div><div><b>فريق تفعيل التجار</b><div class="small">متصل الآن</div></div></div><div class="banner red">⚠ حسابك يحتاج إلى التفعيل — اضغط لمتابعة الإدارة</div><div class="note"><b class="badge">＋</b><span>يمكنك إرسال صور أو ملفات PDF، وستظهر ردود الإدارة لحظيًا.</span></div><div class="bubble">مرحبًا بك في سيجما، أرسل مستندات نشاطك التجاري.</div><div class="bubble mine">تم إرفاق السجل التجاري والبطاقة الضريبية.</div><div class="bubble">وصلت الملفات، جاري مراجعة الحساب الآن.</div><div class="input"><span>＋</span><span class="small" style="flex:1">اكتب رسالتك...</span><span class="send">➤</span></div>`)};document.getElementById('root').innerHTML=screens[page]||screens.login;
</script></body></html>
