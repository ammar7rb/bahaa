<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مراجعة Sigma Vendor</title><style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#eaf0f7;font-family:Cairo;color:#15243a}.bar{position:sticky;top:0;z-index:2;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px;background:#fffffff2;border-bottom:1px solid #dfe7f1}.bar button{border:1px solid #dfe7f1;background:white;padding:9px 13px;border-radius:13px;font:700 11px Cairo;color:#15243a;cursor:pointer}.bar button.on{background:#075acb;color:#fff;border-color:#075acb}.stage{padding:22px;display:grid;place-items:center}.frame{width:390px;height:844px;max-width:100%;border:0;border-radius:30px;background:white;box-shadow:0 22px 60px #18304e28}</style></head><body><nav class="bar"><button data-url="index.html?page=login">1 · الدخول</button><button data-url="phase2.html?page=home">2 · الرئيسية</button><button data-url="phase2.html?page=chat">2 · الشات</button><button data-url="phase3.html?page=orders" class="on">3 · الطلبات</button><button data-url="phase3.html?page=insurance">3 · التأمين</button><button data-url="phase3.html?page=details">3 · التفاصيل</button><button data-url="phase3.html?page=proof">3 · إثبات التسليم</button></nav><main class="stage"><iframe class="frame" src="phase3.html?page=orders"></iframe></main><script>const f=document.querySelector('iframe');document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelector('.on')?.classList.remove('on');b.classList.add('on');f.src=b.dataset.url})</script></body></html>
