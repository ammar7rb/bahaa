<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sigma Vendor Phase 4</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');
:root{--p:#075acb;--bg:#f6f8fc;--card:#fff;--text:#12243d;--muted:#8594a9;--line:#e2e9f3;--green:#11875d;--orange:#d97706;--red:#c62828}*{box-sizing:border-box}body{margin:0;background:#e9eff7;color:var(--text);font-family:Cairo}.phone{width:390px;height:844px;margin:auto;background:var(--bg);position:relative;overflow:hidden}.status{height:34px;padding:8px 18px;direction:ltr;display:flex;justify-content:space-between;font-size:11px;font-weight:800}.appbar{height:58px;display:grid;place-items:center;font-size:18px;font-weight:900}.body{height:752px;overflow:hidden;padding:5px 15px 86px}.title{font-size:15px;font-weight:900}.muted{font-size:9px;color:var(--muted);line-height:1.7}.section{display:flex;align-items:center;gap:9px;margin:7px 0 12px}.icon{width:42px;height:42px;border-radius:13px;background:#075acb12;color:var(--p);display:grid;place-items:center;font-size:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:14px;margin-bottom:11px;box-shadow:0 5px 18px #0000000a}.balances{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}.money{font-size:15px;font-weight:900;margin-top:6px}.tabs{display:flex;gap:7px;overflow:hidden;margin:15px 0 10px}.tab{white-space:nowrap;padding:9px 12px;border-radius:13px;border:1px solid var(--line);background:var(--card);font-size:9px;font-weight:800}.tab.on{background:var(--p);color:#fff}.count{font-size:10px;color:var(--muted);margin-bottom:9px}.head{display:flex;align-items:center;gap:10px}.grow{flex:1}.tag{font-size:8px;font-weight:800;padding:5px 8px;border-radius:9px;background:#11875d15;color:var(--green)}.tag.wait{background:#d9770615;color:var(--orange)}.line{height:1px;background:var(--line);margin:11px 0}.row{display:flex;justify-content:space-between;gap:10px;font-size:10px;margin:7px 0}.value{font-weight:800}.action{border:0;background:#075acb0d;color:var(--p);padding:7px 10px;border-radius:11px;font:800 9px Cairo}.float{position:absolute;left:17px;bottom:17px;background:var(--p);color:white;border:0;border-radius:17px;padding:13px 18px;font:800 11px Cairo;box-shadow:0 10px 22px #075acb50}.notice{padding:12px;border-radius:15px;background:#075acb0b;font-size:10px;line-height:1.7;margin-bottom:11px}.complaint{height:752px;padding:5px 0 78px}.complaint .inner{padding:0 15px}.bubble{max-width:80%;padding:11px 13px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:10px;line-height:1.7;margin-top:11px}.mine{margin-right:auto;background:var(--p);color:#fff;border:0}.composer{position:absolute;bottom:0;left:0;right:0;width:100%;padding:8px;background:var(--card);border-top:1px solid var(--line)}.input{height:57px;width:100%;border:0;border-radius:19px;background:var(--bg);display:flex;align-items:center;padding:8px 14px;color:var(--muted);font-size:10px}.send{margin-right:auto;width:39px;height:39px;border-radius:50%;background:var(--p);color:white;display:grid;place-items:center;font-size:17px}.attach{margin-left:9px;color:var(--p);font-size:19px}
</style></head><body><main class="phone"><div class="status"><span>9:41</span><span>● ● ● &nbsp;79%</span></div><div id="root"></div></main>
<script>
const q=new URLSearchParams(location.search),page=q.get('page')||'orders';const bar=t=>`<header class="appbar">${t}</header>`;const floating=`<button class="float">＋ إضافة طلب</button>`;
const balance=`<div class="section"><div class="icon">▣</div><div><div class="title">الأرصدة المالية</div><div class="muted">آخر تحديث اليوم 9:41 ص</div></div></div><div class="balances"><div class="metric"><span class="muted">الرصيد المتاح</span><div class="money">12.4K ج.م</div></div><div class="metric"><span class="muted">الرصيد المعلق</span><div class="money">3.2K ج.م</div></div><div class="metric"><span class="muted">رصيد التأمين</span><div class="money">1.5K ج.م</div></div><div class="metric"><span class="muted">الرصيد التشغيلي</span><div class="money">2K ج.م</div></div></div>`;
const tabs=active=>`<div class="tabs"><span class="tab ${active==='orders'?'on':''}">الطلبات</span><span class="tab ${active==='insurance'?'on':''}">التأمينات</span><span class="tab ${active==='shipping'?'on':''}">مستحقات الشحن</span><span class="tab ${active==='deposits'?'on':''}">الإيداعات</span></div>`;
const orderCard=(id,status,shipping,insurance)=>`<section class="card"><div class="head"><div class="icon">▤</div><div class="grow"><div class="title">طلب #${id}</div><div class="muted">12 سبتمبر 2026 · 10:45 ص</div></div><span class="tag">${status}</span></div><div class="line"></div><div class="row"><span>مستحق المبيعات</span><b>1,300 ج.م</b></div><div class="row"><span>مستحق الشحن</span><b>${shipping}</b></div><div class="row"><span>تأمين الطلب</span><b>${insurance}</b></div><button class="action">عرض تفاصيل الطلب ←</button></section>`;
const orders=`${bar('المحفظة والسجلات')}<div class="body">${balance}${tabs('orders')}<div class="count">عدد الطلبات: <b>18</b></div>${orderCard('1048','مستحق','148 ج.م','250 ج.م')}${orderCard('1052','قيد التسوية','75 ج.م','لا يوجد تأمين')}</div>${floating}`;
const insurance=`${bar('سجل التأمينات')}<div class="body">${balance}${tabs('insurance')}<div class="count">عدد العمليات: <b>6</b></div><section class="card"><div class="head"><div class="icon">♢</div><div class="grow"><div class="title">تأمين طلب #1048</div><div class="muted">12 سبتمبر 2026 · 10:47 ص</div></div><span class="tag wait">محجوز</span></div><div class="line"></div><div class="row"><span>قيمة التأمين</span><b>250 ج.م</b></div><div class="row"><span>متاح لإعادة الاستخدام</span><b>27 سبتمبر 2026 · 10:47 ص</b></div></section><section class="card"><div class="head"><div class="icon">✓</div><div class="grow"><div class="title">تأمين طلب #1021</div><div class="muted">2 سبتمبر 2026 · 3:15 م</div></div><span class="tag">متاح</span></div><div class="line"></div><div class="row"><span>القيمة</span><b>180 ج.م</b></div><div class="row"><span>تمت الإتاحة</span><b>12 سبتمبر 2026 · 3:15 م</b></div></section></div>${floating}`;
const shipping=`${bar('مستحقات الشحن')}<div class="body">${balance}${tabs('shipping')}<div class="count">عدد العمليات: <b>9</b></div><section class="card"><div class="head"><div class="icon">⌁</div><div class="grow"><div class="title">شحن طلب #1048</div><div class="muted">12 سبتمبر 2026 · 10:45 ص</div></div><span class="tag wait">معلق</span></div><div class="line"></div><div class="row"><span>مبلغ مستحق الشحن</span><b>148 ج.م</b></div><div class="row"><span>موعد الاستحقاق</span><b>16 سبتمبر · 4:00 م</b></div><button class="action">⚠ اعتراض على مبلغ الشحن</button></section><section class="card"><div class="head"><div class="icon">✓</div><div class="grow"><div class="title">شحن طلب #1036</div><div class="muted">8 سبتمبر 2026 · 1:20 م</div></div><span class="tag">تمت التسوية</span></div><div class="line"></div><div class="row"><span>المبلغ</span><b>95 ج.م</b></div><div class="row"><span>تاريخ التسوية</span><b>11 سبتمبر · 11:30 ص</b></div></section></div>${floating}`;
const deposits=`${bar('سجل الإيداعات')}<div class="body">${balance}${tabs('deposits')}<div class="count">عدد العمليات: <b>4</b></div><section class="card"><div class="head"><div class="icon">↓</div><div class="grow"><div class="title">إيداع رصيد تشغيلي</div><div class="muted">13 سبتمبر 2026 · 9:05 ص</div></div><span class="tag">تم الإيداع بنجاح</span></div><div class="line"></div><div class="row"><span>قيمة الإيداع</span><b>2,000 ج.م</b></div><div class="row"><span>المرجع</span><b>DEP-240913</b></div></section><section class="card"><div class="head"><div class="icon">↓</div><div class="grow"><div class="title">إيداع عبر بوابة الدفع</div><div class="muted">10 سبتمبر 2026 · 2:40 م</div></div><span class="tag wait">قيد المراجعة</span></div><div class="line"></div><div class="row"><span>القيمة</span><b>500 ج.م</b></div></section></div>${floating}`;
const complaint=`${bar('اعتراض على مبلغ الشحن')}<div class="complaint"><div class="inner"><section class="card"><div class="head"><div class="icon">⚠</div><div><div class="title">طلب #1048</div><div class="muted">مبلغ مستحق الشحن: 148 ج.م</div></div></div></section><div class="notice">وضّح سبب اعتراضك على مبلغ الشحن لهذا الطلب، وسيصلك رد الإدارة هنا مباشرة.</div><div class="bubble mine">قيمة الشحن أعلى من القيمة المتفق عليها، برجاء مراجعة الحساب.</div><div class="bubble">تم استلام اعتراضك وسيتم مراجعة بيانات الشحن والرد عليك هنا.</div></div><div class="composer"><div class="input"><span class="attach">＋</span><span>اكتب تفاصيل الاعتراض...</span><span class="send">➤</span></div></div></div>`;
document.getElementById('root').innerHTML=({orders,insurance,shipping,deposits,complaint})[page]||orders;
</script></body></html>
