<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sigma Vendor Phase 2</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');:root{--p:#075acb;--bg:#f6f8fc;--card:#fff;--text:#15243a;--muted:#8a97aa;--line:#e5eaf2;--green:#11875d;--orange:#e07800}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Cairo;color:var(--text)}body.dark{--bg:#091525;--card:#14243c;--text:#eef5ff;--muted:#9fb0ca;--line:#243652}.phone{width:390px;height:844px;margin:auto;background:var(--bg);overflow:hidden;position:relative}.status{height:34px;padding:8px 18px;direction:ltr;display:flex;justify-content:space-between;font-size:11px;font-weight:800}.head{height:70px;display:grid;place-items:center;position:relative}.head img{width:152px;height:52px;object-fit:contain}.dark .head img{filter:brightness(0) invert(1)}.bell{position:absolute;left:18px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--p);font-size:21px;box-shadow:0 5px 18px #0000000d}.scroll{height:662px;overflow:hidden;padding:2px 16px 24px}.activation{background:#c62828;color:white;padding:12px 14px;border-radius:17px;font-size:11px;font-weight:800;margin-bottom:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:0 5px 18px #0000000b}.title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:900;margin-bottom:14px}.title i,.metric i{font-style:normal;width:39px;height:39px;border-radius:13px;background:#075acb14;color:var(--p);display:grid;place-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{min-height:103px;padding:12px;background:#075acb0b;border:1px solid #075acb19;border-radius:18px}.metric i{width:33px;height:33px;font-size:16px}.value{font-weight:900;font-size:16px;margin-top:6px}.label{font-size:10px;color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.chip{border:1px solid var(--p);color:var(--p);padding:7px 10px;border-radius:12px;font-size:10px;font-weight:800}.analytics{display:flex;justify-content:space-between;align-items:center}.select{padding:8px 11px;border:1px solid var(--line);border-radius:12px;font-size:10px}.order-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.order{padding:11px 9px;border:1px solid var(--line);border-radius:17px}.order .num{font-size:21px;font-weight:900}.order .label{white-space:nowrap}.bottom{height:78px;background:var(--card);border-top:1px solid var(--line);display:flex;box-shadow:0 -3px 16px #00000010}.nav{flex:1;display:grid;place-items:center;align-content:center;gap:3px;font-size:9px;color:var(--muted)}.nav i{font-style:normal;font-size:20px;padding:4px 12px;border-radius:13px}.nav.on{color:var(--p);font-weight:800}.nav.on i{background:var(--p);color:#fff}.chat{height:732px;padding:8px 16px 90px;position:relative}.person{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);padding:13px;border-radius:20px}.avatar{width:44px;height:44px;border-radius:14px;background:#075acb16;color:var(--p);display:grid;place-items:center}.online{margin-right:auto;color:var(--green);font-size:10px}.bubble{max-width:78%;padding:12px 14px;border-radius:17px;border:1px solid var(--line);background:var(--card);font-size:11px;line-height:1.7;margin-top:13px}.mine{margin-right:auto;background:var(--p);color:#fff;border:0}.composer{position:absolute;left:16px;right:16px;bottom:18px;height:58px;border:1px solid var(--line);background:var(--card);border-radius:20px;display:flex;align-items:center;padding:8px 12px;color:var(--muted);font-size:11px;box-shadow:0 5px 18px #00000012}.send{margin-right:auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--p);color:#fff;font-size:18px}
</style></head><body><main class="phone"><div class="status"><span>9:41</span><span>● ● ● &nbsp;79%</span></div><div id="root"></div></main><script>
const q=new URLSearchParams(location.search),p=q.get('page')||'home';if(q.get('theme')==='dark')document.body.classList.add('dark');const nav=`<nav class="bottom"><div class="nav on"><i>⌂</i>الرئيسية</div><div class="nav"><i>▤</i>طلباتي</div><div class="nav"><i>↶</i>الاسترداد</div><div class="nav"><i>▦</i>القائمة</div></nav>`;const head=`<header class="head"><img src="logo.png"><div class="bell">♧</div></header>`;const metric=(i,v,l)=>`<div class="metric"><i>${i}</i><div class="value">${v}</div><div class="label">${l}</div></div>`;const home=`${head}<div class="scroll"><div class="activation">⚠ حساب التاجر يحتاج إلى التفعيل — متابعة الإدارة</div><section class="card"><div class="title"><i>▦</i>نظرة عامة على نشاطك</div><div class="grid">${metric('✓','12','المنتجات النشطة')}${metric('◴','3','المنتجات المعلقة')}${metric('£','18.5K ج.م','إجمالي المبيعات')}${metric('▣','2','الإعلانات النشطة')}</div><div class="actions"><span class="chip">＋ إضافة منتج</span><span class="chip">محفظتي</span><span class="chip">شحن الرصيد</span></div></section><section class="card"><div class="analytics"><div class="title" style="margin:0"><i>▤</i>حالة الطلبات</div><span class="select">إجمالي⌄</span></div><div class="order-grid" style="margin-top:14px"><div class="order"><div class="num">4</div><div class="label">قيد التجهيز</div></div><div class="order"><div class="num">7</div><div class="label">طلبات مؤكدة</div></div><div class="order"><div class="num">21</div><div class="label">تم التسليم</div></div></div></section></div>${nav}`;
const chat=`<div class="chat"><div class="person"><div class="avatar">♙</div><div><b>فريق تفعيل التجار</b><div class="label">دعم سيجما</div></div><span class="online">● متصل الآن</span></div><div class="activation" style="margin-top:12px">⚠ حسابك يحتاج إلى التفعيل — أرسل المستندات المطلوبة</div><div class="bubble">مرحبًا بك في سيجما، أرسل لنا مستندات نشاطك التجاري وسنراجعها فورًا.</div><div class="bubble mine">تم إرفاق السجل التجاري والبطاقة الضريبية.</div><div class="bubble">تم استلام الملفات، وجارٍ مراجعة الحساب الآن.</div><div class="composer"><span>＋ &nbsp; اكتب رسالتك...</span><span class="send">➤</span></div></div>`;document.getElementById('root').innerHTML=p==='chat'?chat:home;
</script></body></html>
