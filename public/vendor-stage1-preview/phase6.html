<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sigma Vendor — المرحلة السادسة</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
:root{--p:#075acb;--light:#59c9fa;--bg:#f6f8fc;--card:#fff;--text:#0a2342;--muted:#718198;--line:#e1e8f2;--green:#11875d;--red:#c62828}*{box-sizing:border-box}body{margin:0;background:#dfe5ed;font-family:Cairo,sans-serif;color:var(--text)}.phone{width:390px;min-height:844px;margin:20px auto;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 18px 60px #17243d30}.status{height:28px;padding:6px 18px;font-size:11px;direction:ltr}.head{height:62px;display:flex;align-items:center;padding:0 16px;background:var(--bg)}.head h1{font-size:20px;margin:auto;font-weight:800}.back{font-size:28px;color:var(--text)}main{padding:14px 16px 96px}.hero{background:linear-gradient(135deg,var(--light),var(--p));border-radius:24px;padding:18px;color:#fff;display:flex;align-items:center;gap:14px;box-shadow:0 10px 24px #075acb25}.avatar{width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:31px}.hero h2{margin:0;font-size:18px}.hero p{margin:3px 0;font-size:11px;opacity:.85}.pill{display:inline-block;background:#ffffff25;border-radius:15px;padding:5px 10px;margin-top:7px;font-size:10px;font-weight:700}.title{font-size:15px;font-weight:800;margin:18px 2px 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.row,.bank{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 5px 18px #0b254508}.metric{padding:13px;min-height:112px}.icon{width:38px;height:38px;border-radius:12px;background:#eaf3ff;color:var(--p);display:grid;place-items:center;font-size:19px}.metric b{display:block;margin-top:10px;font-size:15px}.metric span,.sub{font-size:10px;color:var(--muted)}.row{padding:12px;display:flex;align-items:center;gap:11px;margin-bottom:9px}.row .grow{flex:1}.row b{font-size:12px;display:block}.arrow{font-size:20px;color:var(--muted)}.handle{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 16px}.menu-title{font-size:21px;font-weight:800}.menu-hint{font-size:11px;color:var(--muted);margin:2px 0 17px}.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.menu-item{height:66px;background:#fff;border:1px solid var(--line);border-radius:18px;display:flex;align-items:center;padding:10px;gap:9px;font-size:11px;font-weight:700}.menu-item .icon{width:36px;height:36px;font-size:17px}.logout{color:var(--red);background:#c6282810;margin-top:14px}.bottom{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);height:76px;display:flex;align-items:center;justify-content:space-around}.bottom div{text-align:center;color:var(--muted);font-size:9px}.bottom .active{color:var(--p);font-weight:800}.bottom i{display:block;font-style:normal;font-size:22px}.settings-card{padding:14px}.switch{width:44px;height:24px;border-radius:14px;background:var(--p);position:relative}.switch:after{content:'';position:absolute;left:23px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff}.bank{padding:4px 16px}.bank-line{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line);font-size:12px}.bank-line:last-child{border:0}.bank-line span{color:var(--muted)}button{border:0;background:var(--p);color:#fff;width:100%;height:52px;border-radius:17px;font-family:inherit;font-weight:800;margin-top:14px}.notice{padding:14px;border-radius:18px;background:#eaf3ff;border:1px solid #cfe2ff;display:flex;gap:10px;align-items:center}.notice p{margin:2px 0;font-size:10px;color:var(--muted)}
</style></head><body><div class="phone"><div class="status">9:41　●●●　79%</div><header class="head"><span class="back">‹</span><h1 id="heading"></h1></header><main id="content"></main><nav class="bottom"><div><i>⌂</i>الرئيسية</div><div><i>▤</i>الطلبات</div><div><i>▣</i>المنتجات</div><div class="active"><i>▦</i>القائمة</div></nav></div><script>
const q=new URLSearchParams(location.search),page=q.get('page')||'profile',h=document.querySelector('#heading'),c=document.querySelector('#content');
const metric=(i,v,l)=>`<div class="card metric"><div class="icon">${i}</div><b>${v}</b><span>${l}</span></div>`;
const row=(i,t,s='')=>`<div class="row"><div class="icon">${i}</div><div class="grow"><b>${t}</b>${s?`<span class="sub">${s}</span>`:''}</div><span class="arrow">‹</span></div>`;
if(page==='profile'){h.textContent='الملف الشخصي';c.innerHTML=`<section class="hero"><div class="avatar">👤</div><div><h2>أحمد محمد</h2><p>vendor@sigma-medical.com</p><span class="pill">تعديل الملف الشخصي</span></div></section><div class="title">ملخص الحساب</div><div class="grid">${metric('▣','12','المنتجات')}${metric('▤','8','الطلبات')}${metric('▰','18,500 ج.م','الرصيد المستحق')}${metric('♢','2,400 ج.م','رصيد التأمين')}</div><div class="title">إدارة الحساب</div>${row('🏦','معلومات البنك','حساب استلام المستحقات')}${row('⚙','الإعدادات','اللغة والمظهر وإعدادات التطبيق')}`}
if(page==='menu'){h.textContent='';c.innerHTML=`<div class="handle"></div><div class="menu-title">قائمة التاجر</div><div class="menu-hint">كل أدوات إدارة نشاطك في مكان واحد</div><div class="title">إدارة النشاط</div><div class="menu-grid">${[['◉','الملف الشخصي'],['▣','المنتجات'],['＋','إضافة منتج'],['▰','المحفظة'],['⌑','الكوبونات'],['◫','الباقات الإعلانية'],['↗','الترويج'],['🏦','معلومات البنك']].map(x=>`<div class="menu-item"><div class="icon">${x[0]}</div>${x[1]}</div>`).join('')}</div><div class="title">الإعدادات والمعلومات</div><div class="menu-grid">${[['⚙','الإعدادات'],['▤','الشروط والأحكام'],['♢','سياسة الخصوصية'],['ⓘ','معلومات عنا']].map(x=>`<div class="menu-item"><div class="icon">${x[0]}</div>${x[1]}</div>`).join('')}</div><div class="row logout"><div class="icon">↪</div><div class="grow"><b>تسجيل الخروج</b></div></div>`}
if(page==='settings'){h.textContent='الإعدادات';c.innerHTML=`<div class="title">تفضيلات التطبيق</div>${row('文','لغة التطبيق','العربية والإنجليزية')}<div class="row settings-card"><div class="icon">☾</div><div class="grow"><b>الوضع الداكن</b><span class="sub">تغيير مظهر التطبيق</span></div><div class="switch"></div></div>`}
if(page==='bank'){h.textContent='معلومات البنك';c.innerHTML=`<div class="notice"><div class="icon">🏦</div><div><b>حساب استلام المستحقات</b><p>أضف بيانات الحساب البنكي الذي تستلم عليه مستحقاتك.</p></div></div><div class="title">بيانات الحساب</div><div class="bank"><div class="bank-line"><span>اسم صاحب الحساب</span><b>أحمد محمد</b></div><div class="bank-line"><span>اسم البنك</span><b>البنك التجاري الدولي</b></div><div class="bank-line"><span>الفرع</span><b>مدينة نصر</b></div><div class="bank-line"><span>رقم الحساب</span><b>••••••••4821</b></div></div><button>✎ تعديل البيانات</button>`}
</script></body></html>
