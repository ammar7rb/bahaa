<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sigma Vendor — المرحلة الخامسة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eaf0f8;font-family:Cairo,Arial;color:#071b39}.phone{width:min(390px,100vw);height:844px;margin:auto;background:#f6f8fc;position:relative;overflow:hidden}.status{height:34px;padding:8px 18px;font:700 11px Arial;direction:ltr;display:flex;justify-content:space-between}.app{height:58px;padding:5px 16px;display:flex;align-items:center;justify-content:space-between}.app h1{font-size:20px;margin:0}.back{width:38px;height:38px;border-radius:50%;border:1px solid #e1e8f2;background:#fff;color:#075acb;font-size:21px}.body{height:694px;overflow:auto;padding:4px 16px 110px;scrollbar-width:none}.hero{background:linear-gradient(135deg,#59c9fa,#075acb);color:white;padding:17px;border-radius:24px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 25px #075acb28}.hero .i{font-size:27px}.hero strong{display:block;font-size:17px}.hero small{opacity:.86}.count{margin-right:auto;font-size:26px;font-weight:800}.search{height:49px;border-radius:17px;border:1px solid #dce5f1;background:white;margin:12px 0 14px;padding:0 14px;display:flex;gap:10px;align-items:center;color:#8493a9}.card{background:#fff;border:1px solid #e0e7f1;border-radius:22px;padding:12px;margin-bottom:11px;box-shadow:0 8px 22px #10233c0a}.product{display:flex;gap:11px}.pic{width:88px;height:88px;flex:none;border-radius:17px;background:#edf5ff;display:grid;place-items:center;font-size:40px}.grow{flex:1;min-width:0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.name{font-size:15px;font-weight:800;margin:1px 0 3px}.price{color:#075acb;font-size:16px;font-weight:800}.more{font-size:22px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:9px;font-weight:700;padding:5px 8px;border-radius:20px;color:#e07800;background:#fff2e3}.chip.green{color:#11875d;background:#e8f6f1}.chip.blue{color:#075acb;background:#eaf3ff}.fab{position:absolute;bottom:22px;left:18px;border:0;border-radius:18px;background:#075acb;color:#fff;padding:14px 19px;font-family:inherit;font-weight:800;box-shadow:0 9px 25px #075acb55}.steps{height:45px;background:#e9eff7;padding:4px;border-radius:24px;display:flex;gap:3px;margin-bottom:13px}.step{flex:1;border-radius:20px;display:grid;place-items:center;font-size:10px;color:#75859b;font-weight:700}.step.on{background:#075acb;color:#fff}.section{background:#fff;border:1px solid #e0e7f1;border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:0 8px 22px #10233c0a}.section h2{font-size:16px;margin:0 0 3px}.section>p{font-size:10px;color:#8997aa;margin:0 0 13px;line-height:1.7}.field{margin-bottom:11px}.field label{display:block;font-size:11px;font-weight:700;margin:0 3px 5px}.input{height:48px;border:1px solid #dce5f1;background:#fafcff;border-radius:15px;padding:13px;color:#526278;font-size:12px}.input.area{height:82px}.upload{height:112px;border:1.5px dashed #9dbce6;border-radius:18px;background:#f7fbff;display:grid;place-items:center;text-align:center;color:#075acb;font-size:12px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.thumb{height:76px;border-radius:14px;background:#edf5ff;display:grid;place-items:center;font-size:28px;border:1px solid #dce8f7}.thumb.add{border:1px dashed #70a7e8;color:#075acb;background:#f8fbff}.three{display:grid;grid-template-columns:1fr 1fr;gap:9px}.note{background:#eaf3ff;border-radius:15px;padding:11px;color:#075acb;font-size:10px;line-height:1.75}.review-line{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #edf1f6;font-size:12px}.review-line:last-child{border:0}.review-line span{color:#7f8da1}.actions{position:absolute;bottom:0;right:0;left:0;background:white;border-top:1px solid #e4eaf3;padding:10px 16px 13px;display:flex;gap:9px}.primary,.secondary{height:48px;border-radius:16px;font-family:inherit;font-weight:800;border:0}.primary{background:#075acb;color:white;flex:2}.secondary{background:#edf2f8;color:#53647a;flex:1}.toggle{width:50px;height:28px;border-radius:20px;background:#13a675;padding:3px;direction:ltr}.toggle:after{content:'';display:block;width:22px;height:22px;border-radius:50%;background:#fff;margin-left:22px}.detail-cover{height:180px;border-radius:24px;background:linear-gradient(145deg,#eef6ff,#d9ebff);display:grid;place-items:center;font-size:82px;margin-bottom:12px}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.outline{height:46px;border:1px solid #075acb;border-radius:15px;background:#fff;color:#075acb;font:700 12px Cairo}
  </style>
</head><body><main class="phone"><div class="status"><span>9:41</span><span>●●● 79%</span></div><header class="app"><h1 id="title"></h1><button class="back">‹</button></header><div class="body" id="content"></div><div id="bottom"></div></main>
<script>
const q=new URLSearchParams(location.search),page=q.get('page')||'list',c=document.querySelector('#content'),b=document.querySelector('#bottom'),t=document.querySelector('#title');
const steps=n=>`<div class="steps"><div class="step ${n===1?'on':''}">المعلومات</div><div class="step ${n===2?'on':''}">السعر والمخزون</div><div class="step ${n===3?'on':''}">المراجعة والحفظ</div></div>`;
const actions=(next,send=false)=>{b.innerHTML=`<div class="actions"><button class="primary">${send?'حفظ المنتج':'التالي'}</button><button class="secondary">السابق</button></div>`};
if(page==='list'){t.textContent='المنتجات';c.innerHTML=`<div class="hero"><span class="i">▣</span><div><strong>إدارة المنتجات</strong><small>تابع منتجاتك ومخزونها وتحكم في تشغيلها</small></div><span class="count">12</span></div><div class="search">⌕ <span>ابحث باسم المنتج أو الكود</span></div>${product('🩺','جهاز قياس ضغط رقمي','850 ج.م','24')}${product('🩹','شنطة إسعافات أولية','299 ج.م','16')}${product('🧪','كارت اختبار سريع','190 ج.م','5')}`;b.innerHTML='<button class="fab">＋ إضافة منتج</button>'}
if(page==='add-info'){t.textContent='إضافة منتج';c.innerHTML=steps(1)+`<section class="section"><h2>المعلومات الأساسية</h2><p>أدخل بيانات المنتج باللغة العربية كما ستظهر في المنصة.</p><div class="field"><label>اسم المنتج *</label><div class="input">جهاز قياس ضغط رقمي</div></div><div class="field"><label>وصف المنتج *</label><div class="input area">جهاز دقيق وسهل الاستخدام للمتابعة اليومية...</div></div></section><section class="section"><h2>الصورة الرئيسية</h2><p>هذه الصورة التي ستظهر في الصفحة الرئيسية وقوائم المنتجات.</p><div class="upload"><div><b style="font-size:24px">＋</b><br>إضافة الصورة الرئيسية</div></div></section><section class="section"><h2>صور المنتج (5 على الأقل)</h2><p>أضف خمس صور واضحة بجانب الصورة الرئيسية.</p><div class="gallery"><div class="thumb">🩺</div><div class="thumb">📦</div><div class="thumb">🔍</div><div class="thumb">📐</div><div class="thumb">🏷️</div><div class="thumb add">＋</div></div></section><section class="section"><h2>التصنيف والعلامة</h2><div class="field"><label>القسم *</label><div class="input">أجهزة القياس المنزلية⌄</div></div><div class="note">إذا لم تعرف القسم المناسب، اختر الأقرب وستراجعه الإدارة وتنقله للقسم الصحيح.</div><br><div class="field"><label>العلامة التجارية</label><div class="input">اختر علامة موجودة⌄</div></div><div class="field"><label>أو اكتب اسم علامة جديدة</label><div class="input">Sigma Care</div></div></section>`;actions(2)}
if(page==='pricing'){t.textContent='إضافة منتج';c.innerHTML=steps(2)+`<section class="section"><h2>طريقة البيع</h2><p>حدّد هل يباع المنتج منفردًا أم داخل عبوة.</p><div class="three"><div class="field"><label>نوع البيع *</label><div class="input">عبوة⌄</div></div><div class="field"><label>عدد القطع بالعبوة *</label><div class="input">10</div></div></div><div class="field"><label>سعر العبوة *</label><div class="input">850 ج.م</div></div><div class="three"><div class="field"><label>المخزون الحالي *</label><div class="input">24 عبوة</div></div><div class="field"><label>أقل كمية للطلب *</label><div class="input">1</div></div></div></section><section class="section"><h2>بيانات إضافية</h2><div class="field"><label>وحدة القياس (اختياري)</label><div class="input">بدون تحديد⌄</div></div><div class="field"><div class="row"><label>كود المنتج *</label><b style="font-size:10px;color:#075acb">إنشاء كود</b></div><div class="input">SIGBP1048</div></div><p>الأبعاد والوزن اختيارية ويمكن إضافتها عند توفرها.</p></section><div class="note">الخصومات والشحن يتم احتسابهما وفق إعدادات الإدارة والمنصة.</div>`;actions(3)}
if(page==='review'){t.textContent='مراجعة المنتج';c.innerHTML=steps(3)+`<section class="section"><h2>راجع المنتج قبل الحفظ</h2><p>تأكد من صحة البيانات والصور والسعر قبل حفظ المنتج.</p><div class="product"><div class="pic">🩺</div><div class="grow"><div class="name">جهاز قياس ضغط رقمي</div><div class="price">850 ج.م / العبوة</div><div class="chips"><span class="chip blue">24 عبوة</span><span class="chip green">10 قطع</span></div></div></div></section><section class="section"><div class="review-line"><span>القسم</span><b>أجهزة القياس</b></div><div class="review-line"><span>العلامة</span><b>Sigma Care</b></div><div class="review-line"><span>كود المنتج</span><b>SIGBP1048</b></div><div class="review-line"><span>عدد الصور</span><b>رئيسية + 5 صور</b></div></section>`;actions(2,true)}
if(page==='details'){t.textContent='تفاصيل المنتج';c.innerHTML=`<div class="detail-cover">🩺</div><section class="section"><div class="row"><div><div class="name">جهاز قياس ضغط رقمي</div><div class="price">850 ج.م / العبوة</div></div><div style="display:flex;align-items:center;gap:7px"><b style="font-size:11px;color:#11875d">نشط</b><div class="toggle"></div></div></div><div class="chips"><span class="chip blue">المخزون: 24 عبوة</span><span class="chip green">10 قطع في العبوة</span></div></section><section class="section"><div class="review-line"><span>كود المنتج</span><b>SIGBP1048</b></div><div class="review-line"><span>القسم</span><b>أجهزة القياس</b></div><div class="review-line"><span>العلامة التجارية</span><b>Sigma Care</b></div><div class="review-line"><span>أقل كمية للطلب</span><b>عبوة واحدة</b></div></section><div class="action-grid"><button class="outline">تعديل المنتج</button><button class="outline">إعادة تخزين</button></div>`;b.innerHTML='<div class="actions"><button class="primary">إعادة تخزين المنتج</button></div>'}
function product(icon,name,price,stock){return `<article class="card product"><div class="pic">${icon}</div><div class="grow"><div class="row"><div class="name">${name}</div><span class="more">⋯</span></div><div class="price">${price}</div><div class="chips"><span class="chip green">نشط</span><span class="chip blue">المخزون: ${stock}</span></div></div></article>`}
</script></body></html>
